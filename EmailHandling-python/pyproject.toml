[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emailhandling-python"
version = "0.1.0"
description = "Slice-based Python migration of EmailHandling"
requires-python = ">=3.11"

[project.optional-dependencies]
live = ["pyodbc>=5.0"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
files = ["app"]
