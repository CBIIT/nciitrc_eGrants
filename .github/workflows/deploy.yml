name: eGrants Deployment Workflow

on:
  push:
    branches: [dev, test, stage, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: egrants_fcas-oasys_runner
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # ENVIRONMENT MAPPING BLOCK (branch → environment settings)
      # ---------------------------------------------------------
      - name: Map environment variables
        id: envmap
        shell: powershell
        run: |
          switch ("${{ github.ref_name }}") {
            "dev" {
              echo "PUBLISH_PROFILE=Dev.pubxml" >> $env:GITHUB_OUTPUT
              echo "DEST_PATH=\\\\nciws-d2411-v\\egrants-web-dev-core-migration.nci.nih.gov" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=\\\\nciws-d2411-v\\eGrants-Archive" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=egrants-web-dev-core-migration" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=egrants-web-dev-core-migration-pool" >> $env:GITHUB_OUTPUT
            }
            "test" {
              echo "PUBLISH_PROFILE=Test.pubxml" >> $env:GITHUB_OUTPUT
              echo "DEST_PATH=\\\\server\\egrants-web-test" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=\\\\server\\egrants-test-archive" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=egrants-web-test" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=egrants-web-test-pool" >> $env:GITHUB_OUTPUT
            }
            "stage" {
              echo "PUBLISH_PROFILE=Stage.pubxml" >> $env:GITHUB_OUTPUT
              echo "DEST_PATH=\\\\server\\egrants-web-stage" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=\\\\server\\egrants-stage-archive" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=egrants-web-stage" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=egrants-web-stage-pool" >> $env:GITHUB_OUTPUT
            }
            default {
              echo "PUBLISH_PROFILE=Prod.pubxml" >> $env:GITHUB_OUTPUT
              echo "DEST_PATH=\\\\server\\egrants-web-prod" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=\\\\server\\egrants-prod-archive" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=egrants-web-prod" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=egrants-web-prod-pool" >> $env:GITHUB_OUTPUT
            }
          }

      # ---------------------------------------------------------
      # BUILD USING PUBLISH PROFILE
      # ---------------------------------------------------------
      - name: Build using publish profile
        shell: powershell
        run: |
          dotnet publish "./source-aspnet/eGrants/eGrants.csproj" `
            -c Release `
            /p:PublishProfile=${{ steps.envmap.outputs.PUBLISH_PROFILE }} `
            -o ./build_output

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE
      # ---------------------------------------------------------
      - name: Archive existing destination directory
        shell: powershell
        env:
          SHARE_USER: ${{ secrets.DEPLOY_SHARE_USERNAME }}
          SHARE_PASS: ${{ secrets.DEPLOY_SHARE_PASSWORD }}
        run: |
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $archiveRoot = "${{ steps.envmap.outputs.ARCHIVE_PATH }}"

          # Authenticate to UNC share
          cmdkey /add:$destination /user:$env:SHARE_USER /pass:$env:SHARE_PASS

          if (-not (Test-Path $destination)) { throw "Destination share not reachable: $destination" }
          if (-not (Test-Path $archiveRoot)) { New-Item -ItemType Directory -Path $archiveRoot | Out-Null }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $archivePath = Join-Path $archiveRoot "backup_$timestamp"

          New-Item -ItemType Directory -Path $archivePath | Out-Null
          robocopy $destination $archivePath /MIR
          if ($LASTEXITCODE -ge 8) { throw "Robocopy archive failed: $LASTEXITCODE" }

          Compress-Archive -Path "$archivePath\*" -DestinationPath "$archivePath.zip" -Force
          Remove-Item -Path $archivePath -Recurse -Force

      # ---------------------------------------------------------
      # STOP IIS
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool
        shell: powershell
        env:
          IIS_USER: ${{ secrets.IIS_USERNAME }}
          IIS_PASS: ${{ secrets.IIS_PASSWORD }}
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "${{ steps.envmap.outputs.SITE_NAME }}"
          Stop-WebAppPool -Name "${{ steps.envmap.outputs.APP_POOL }}"
          Start-Sleep -Seconds 5

      # ---------------------------------------------------------
      # DEPLOY FILES
      # ---------------------------------------------------------
      - name: Deploy build output
        shell: powershell
        env:
          SHARE_USER: ${{ secrets.DEPLOY_SHARE_USERNAME }}
          SHARE_PASS: ${{ secrets.DEPLOY_SHARE_PASSWORD }}
        run: |
          $source = "$(Get-Location)\build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          cmdkey /add:$destination /user:$env:SHARE_USER /pass:$env:SHARE_PASS

          robocopy $source $destination /MIR /XF web.config
          if ($LASTEXITCODE -ge 8) { throw "Robocopy deployment failed: $LASTEXITCODE" }

      # ---------------------------------------------------------
      # START IIS
      # ---------------------------------------------------------
      - name: Start IIS site and app pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "${{ steps.envmap.outputs.APP_POOL }}"
          Start-Website -Name "${{ steps.envmap.outputs.SITE_NAME }}"
