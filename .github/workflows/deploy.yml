name: eGrants Deployment Workflow

on:
  push:
    branches:
      - dev
      - test
      - stage
      - eGrants-Core-Main

jobs:
  build-and-deploy:
    runs-on: egrants_fcas-oasys_runner
    environment: ${{ github.ref_name }}

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # LOAD ENVIRONMENT VARIABLES
      # ---------------------------------------------------------
      - name: Load environment variables
        id: envmap
        shell: powershell
        run: |
          echo "DEST_PATH=${{ vars.DEST_PATH }}" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH }}" >> $env:GITHUB_OUTPUT
          echo "SITE_NAME=${{ vars.SITE_NAME }}" >> $env:GITHUB_OUTPUT
          echo "APP_POOL=${{ vars.APP_POOL }}" >> $env:GITHUB_OUTPUT
          echo "REMOTE_SERVER=${{ vars.REMOTE_SERVER }}" >> $env:GITHUB_OUTPUT
          exit 0

      # ---------------------------------------------------------
      # LOAD GITHUB TOKEN
      # ---------------------------------------------------------
      - name: Load GitHub token
        id: token
        shell: powershell
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Build project
        shell: powershell
        run: |
          dotnet restore "./source-aspnet/eGrants/eGrants.csproj"
          dotnet publish "./source-aspnet/eGrants/eGrants.csproj" `
            -c Release `
            -o ./build_output
          exit 0

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE
      # ---------------------------------------------------------
      - name: Archive existing destination directory
        shell: powershell
        run: |
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $archiveRoot = "${{ steps.envmap.outputs.ARCHIVE_PATH }}"

          if (-not (Test-Path $destination)) {
            throw "Destination share not reachable: $destination"
          }

          if (-not (Test-Path $archiveRoot)) {
            New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $archivePath = Join-Path $archiveRoot "backup_$timestamp"

          New-Item -ItemType Directory -Path $archivePath | Out-Null
          robocopy $destination $archivePath /MIR
          if ($LASTEXITCODE -ge 8) { throw "Robocopy archive failed." }

          $zipFile = "$archivePath.zip"
          Compress-Archive -Path "$archivePath\*" -DestinationPath $zipFile -Force
          Remove-Item -Path $archivePath -Recurse -Force

          exit 0

      # ---------------------------------------------------------
      # STOP IIS (REMOTE)
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool (remote)
        shell: powershell
        run: |
          $remote = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool = "${{ steps.envmap.outputs.APP_POOL }}"

          Invoke-Command -ComputerName $remote -ScriptBlock {
              param($siteName, $appPool)

              Import-Module WebAdministration

              if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
                  Stop-WebAppPool -Name $appPool -ErrorAction Stop
              }

              if ((Get-Website -Name $siteName).state -ne "Stopped") {
                  Stop-Website -Name $siteName -ErrorAction Stop
              }

              Start-Sleep -Seconds 3

              if ((Get-Website -Name $siteName).state -ne "Stopped") {
                throw "IIS site did not stop properly: $siteName"
              }

              if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
                throw "IIS app pool did not stop properly: $appPool"
              }
          } -ArgumentList $siteName, $appPool

          exit 0

      # ---------------------------------------------------------
      # DEPLOY FILES
      # ---------------------------------------------------------
      - name: Deploy build output
        shell: powershell
        run: |
          $source = "$(Get-Location)\build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          if (-not (Test-Path $source)) { throw "Build output not found: $source" }
          if (-not (Test-Path $destination)) { throw "Destination share not reachable: $destination" }

          robocopy $source $destination /MIR /XF web.config
          if ($LASTEXITCODE -ge 8) { throw "Robocopy deployment failed." }

          exit 0

      # ---------------------------------------------------------
      # UPDATE APPSETTINGS.JSON ON DESTINATION SERVER USING _GITHUB_TOKEN ENV SECRET
      # ---------------------------------------------------------
      - name: Update GitHubToken in destination appsettings.json
        shell: powershell
        run: |
          # Pull the token from the environment secret
          $token = "${{ secrets._GITHUB_TOKEN }}"

          $remote = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          Invoke-Command -ComputerName $remote -ScriptBlock {
              param($destination, $token)

              $appSettingsPath = Join-Path $destination "appsettings.json"

              if (-not (Test-Path $appSettingsPath)) {
                  throw "Destination appsettings.json not found: $appSettingsPath"
              }

              # Load JSON
              $json = Get-Content $appSettingsPath -Raw | ConvertFrom-Json

              # Ensure AppSettings exists
              if (-not $json.AppSettings) {
                  $json | Add-Member -MemberType NoteProperty -Name "AppSettings" -Value (@{})
              }

              # Update GitHubToken value
              $json.AppSettings.GitHubToken = $token

              # Save JSON with proper formatting
              $formatted = $json | ConvertTo-Json -Depth 20 -Compress:$false
              Set-Content -Path $appSettingsPath -Value $formatted -Encoding UTF8

          } -ArgumentList $destination, $token

          exit 0

      # ---------------------------------------------------------
      # START IIS (REMOTE)
      # ---------------------------------------------------------
      - name: Start IIS site and app pool (remote)
        shell: powershell
        run: |
          $remote = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool = "${{ steps.envmap.outputs.APP_POOL }}"

          Invoke-Command -ComputerName $remote -ScriptBlock {
              param($siteName, $appPool)

              Import-Module WebAdministration

              if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
                  Start-WebAppPool -Name $appPool -ErrorAction Stop
              }

              if ((Get-Website -Name $siteName).state -ne "Started") {
                  Start-Website -Name $siteName -ErrorAction Stop
              }

              Start-Sleep -Seconds 3

              if ((Get-Website -Name $siteName).state -ne "Started") {
                throw "IIS site did not start properly: $siteName"
              }

              if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
                throw "IIS app pool did not start properly: $appPool"
              }
          } -ArgumentList $siteName, $appPool

          exit 0
