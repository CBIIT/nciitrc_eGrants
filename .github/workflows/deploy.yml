name: eGrants Deployment Workflow

on:
  # Automatic deployments only happen from these branches.
  # A push to dev deploys to dev.
  # A push to test deploys to test.
  push:
    branches:
      - dev
      - test

  # Manual deployments are used when we want to target an environment
  # that is not tied directly to the pushed branch, such as stage or prod.
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
        default: dev

env:
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

jobs:
  build-and-deploy:
    # dev/test use the non-prod runner
    # stage/prod use the prod runner
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target_branch == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target_branch == 'test') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'test')) && 'egrants_fcas-oasys_runner' || 'egrants_fcas-oasys_runner_prod' }}

    # Tie the job to the matching GitHub Environment so that
    # environment-specific secrets/approvals/protections can apply.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # LOAD ENVIRONMENT VARIABLES
      # ---------------------------------------------------------
      - name: Load environment variables
        id: envmap
        shell: powershell
        run: |
          $branch = "${{ env.DEPLOY_ENV }}"
          Write-Host "Environment detected: $branch"

          switch ($branch) {
            "dev" {
              echo "DEST_PATH=${{ vars.DEST_PATH_DEV }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_DEV }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_DEV }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_DEV }}" >> $env:GITHUB_OUTPUT
            }

            "test" {
              echo "DEST_PATH=${{ vars.DEST_PATH_TEST }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_TEST }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_TEST }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_TEST }}" >> $env:GITHUB_OUTPUT
              echo "DEPLOY_USER=${{ secrets.DEPLOY_USER_TEST }}" >> $env:GITHUB_OUTPUT
              echo "DEPLOY_PASS=${{ secrets.DEPLOY_PASS_TEST }}" >> $env:GITHUB_OUTPUT
            }

            "stage" {
              echo "DEST_PATH=${{ vars.DEST_PATH_STAGE }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_STAGE }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_STAGE }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_STAGE }}" >> $env:GITHUB_OUTPUT
            }

            "prod" {
              echo "DEST_PATH=${{ vars.DEST_PATH_PROD }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_PROD }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_PROD }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_PROD }}" >> $env:GITHUB_OUTPUT
              echo "DEPLOY_USER=${{ secrets.DEPLOY_USER_PROD }}" >> $env:GITHUB_OUTPUT
              echo "DEPLOY_PASS=${{ secrets.DEPLOY_PASS_PROD }}" >> $env:GITHUB_OUTPUT
            }

            default {
              throw "Unsupported deployment environment: $branch"
            }
          }

          echo "REMOTE_SERVER=${{ vars.REMOTE_SERVER }}" >> $env:GITHUB_OUTPUT
          exit 0

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Build project
        shell: powershell
        run: |
          dotnet restore "./source-aspnet/eGrants/eGrants.csproj"

          dotnet publish "./source-aspnet/eGrants/eGrants.csproj" `
            -c Release `
            -o ./build_output

      # ---------------------------------------------------------
      # REPLACE TOKEN IN APPSETTINGS.JSON
      # ---------------------------------------------------------
      - name: Replace GitHubToken value with secret
        shell: powershell
        run: |
          $file = "$(Get-Location)\build_output\appsettings.json"
          $token = "${{ secrets._GITHUB_TOKEN }}"

          if (-not (Test-Path $file)) {
            throw "appsettings.json not found at: $file"
          }

          $json = Get-Content $file -Raw
          $pattern = '"GitHubToken"\s*:\s*".*?"'
          $replacement = '"GitHubToken": "' + $token + '"'
          $json = $json -replace $pattern, $replacement
          Set-Content -Path $file -Value $json -Encoding UTF8

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE
      # ---------------------------------------------------------
      - name: Archive existing destination directory
        shell: powershell
        run: |
          function Invoke-NetUse {
            param(
              [Parameter(Mandatory = $true)][string]$Drive,
              [Parameter(Mandatory = $true)][string]$Share,
              [Parameter(Mandatory = $true)][string]$Username,
              [Parameter(Mandatory = $true)][string]$Password
            )

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = "net.exe"
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true

            $null = $psi.ArgumentList.Add("use")
            $null = $psi.ArgumentList.Add($Drive)
            $null = $psi.ArgumentList.Add($Share)
            $null = $psi.ArgumentList.Add($Password)
            $null = $psi.ArgumentList.Add("/user:$Username")
            $null = $psi.ArgumentList.Add("/persistent:no")

            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = $psi
            [void]$proc.Start()

            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            $proc.WaitForExit()

            if ($stdout) { Write-Host $stdout.Trim() }
            if ($stderr) { Write-Host $stderr.Trim() }

            if ($proc.ExitCode -ne 0) {
              throw "net use failed for drive $Drive -> $Share (exit code $($proc.ExitCode))"
            }
          }

          function Remove-NetUse {
            param(
              [Parameter(Mandatory = $true)][string]$Drive
            )

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = "net.exe"
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true

            $null = $psi.ArgumentList.Add("use")
            $null = $psi.ArgumentList.Add($Drive)
            $null = $psi.ArgumentList.Add("/delete")
            $null = $psi.ArgumentList.Add("/y")

            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = $psi
            [void]$proc.Start()

            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            $proc.WaitForExit()

            if ($stdout) { Write-Host $stdout.Trim() }
            if ($stderr) { Write-Host $stderr.Trim() }
          }

          $branch = '${{ env.DEPLOY_ENV }}'
          $destination = '${{ steps.envmap.outputs.DEST_PATH }}'
          $archiveRoot = '${{ steps.envmap.outputs.ARCHIVE_PATH }}'
          $deployUser = '${{ steps.envmap.outputs.DEPLOY_USER }}'
          $deployPass = '${{ steps.envmap.outputs.DEPLOY_PASS }}'

          $destDrive = 'Z:'
          $archDrive = 'Y:'

          try {
            if ($branch -eq 'test' -or $branch -eq 'prod') {
              Write-Host 'Mapping remote shares using net.exe with ArgumentList...'

              if ([string]::IsNullOrWhiteSpace($deployUser) -or [string]::IsNullOrWhiteSpace($deployPass)) {
                throw "DEPLOY_USER or DEPLOY_PASS is missing."
              }

              if (-not $destination.StartsWith('\\') -or -not $archiveRoot.StartsWith('\\')) {
                throw "DEST_PATH and ARCHIVE_PATH must be UNC paths for test/prod."
              }

              $destParts = $destination -split '\\'
              $archParts = $archiveRoot -split '\\'

              if ($destParts.Length -lt 4) {
                throw "DEST_PATH is not a valid UNC path: $destination"
              }
              if ($archParts.Length -lt 4) {
                throw "ARCHIVE_PATH is not a valid UNC path: $archiveRoot"
              }

              $destShareRoot = '\\' + $destParts[2] + '\' + $destParts[3]
              $archShareRoot = '\\' + $archParts[2] + '\' + $archParts[3]

              Write-Host "Destination share root: $destShareRoot"
              Write-Host "Archive share root: $archShareRoot"

              Remove-NetUse -Drive $destDrive
              Remove-NetUse -Drive $archDrive

              Invoke-NetUse -Drive $destDrive -Share $destShareRoot -Username $deployUser -Password $deployPass
              Invoke-NetUse -Drive $archDrive -Share $archShareRoot -Username $deployUser -Password $deployPass

              $mappedDest = $destination.Replace($destShareRoot, $destDrive)
              $mappedArchive = $archiveRoot.Replace($archShareRoot, $archDrive)
            }
            else {
              Write-Host 'DEV or STAGE environment detected — no credentialed share mapping required.'
              $mappedDest = $destination
              $mappedArchive = $archiveRoot
            }

            Write-Host "Environment: $branch"
            Write-Host "Destination path: $mappedDest"
            Write-Host "Archive path: $mappedArchive"

            if (-not (Test-Path $mappedDest)) {
              throw "Destination path not reachable: $mappedDest"
            }

            if (-not (Test-Path $mappedArchive)) {
              New-Item -ItemType Directory -Path $mappedArchive | Out-Null
            }

            $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
            $localTemp = Join-Path $env:TEMP "archive_$timestamp"
            $localZip  = Join-Path $env:TEMP "archive_$timestamp.zip"
            $remoteZip = Join-Path $mappedArchive "backup_$timestamp.zip"

            New-Item -ItemType Directory -Path $localTemp | Out-Null

            robocopy $mappedDest $localTemp /MIR
            if ($LASTEXITCODE -ge 8) { throw 'Robocopy local copy failed.' }

            Compress-Archive -Path "$localTemp\*" -DestinationPath $localZip -Force
            Copy-Item -Path $localZip -Destination $remoteZip -Force

            Remove-Item -Path $localTemp -Recurse -Force
            Remove-Item -Path $localZip -Force

            $archives = Get-ChildItem -Path $mappedArchive -Filter 'backup_*.zip' |
              Sort-Object LastWriteTime -Descending

            $archivesToDelete = $archives | Select-Object -Skip 5
            foreach ($old in $archivesToDelete) {
              Remove-Item -Path $old.FullName -Force
            }

            exit 0
          }
          finally {
            if ($branch -eq 'test' -or $branch -eq 'prod') {
              Remove-NetUse -Drive $destDrive
              Remove-NetUse -Drive $archDrive
            }
          }

      # ---------------------------------------------------------
      # DIAGNOSTICS
      # ---------------------------------------------------------
      - name: Diagnostics (runner host + IIS visibility)
        shell: powershell
        run: |
          Write-Host "=== BASIC CONTEXT ==="
          Write-Host "DEPLOY_ENV                = ${{ env.DEPLOY_ENV }}"
          Write-Host "github.event_name         = ${{ github.event_name }}"
          Write-Host "github.ref_name           = ${{ github.ref_name }}"
          Write-Host "github.repository         = ${{ github.repository }}"
          Write-Host "github.run_id             = ${{ github.run_id }}"
          Write-Host "github.run_number         = ${{ github.run_number }}"
          Write-Host "runner.name               = ${{ runner.name }}"
          Write-Host "runner.os                 = ${{ runner.os }}"
          Write-Host "runner.arch               = ${{ runner.arch }}"
          Write-Host "COMPUTERNAME              = $env:COMPUTERNAME"
          Write-Host "USERNAME                  = $env:USERNAME"
          Write-Host "USERDOMAIN                = $env:USERDOMAIN"
          Write-Host "PROCESS whoami            = $(whoami)"
          Write-Host "PowerShell version        = $($PSVersionTable.PSVersion)"
          Write-Host ""

          Write-Host "=== ENV OUTPUTS (FROM envmap) ==="
          Write-Host "SITE_NAME                 = '${{ steps.envmap.outputs.SITE_NAME }}'"
          Write-Host "APP_POOL                  = '${{ steps.envmap.outputs.APP_POOL }}'"
          Write-Host "DEST_PATH                 = '${{ steps.envmap.outputs.DEST_PATH }}'"
          Write-Host "ARCHIVE_PATH              = '${{ steps.envmap.outputs.ARCHIVE_PATH }}'"
          Write-Host "REMOTE_SERVER             = '${{ steps.envmap.outputs.REMOTE_SERVER }}'"
          Write-Host ""

          Write-Host "=== IIS SERVICES (LOCAL MACHINE) ==="
          try {
            Get-Service W3SVC, WAS -ErrorAction Stop | Format-Table Name, Status, StartType
          } catch {
            Write-Host "Unable to query W3SVC/WAS services: $($_.Exception.Message)"
          }
          Write-Host ""

          Write-Host "=== IIS PROVIDER CHECK ==="
          try {
            Import-Module WebAdministration -ErrorAction Stop
            Write-Host "WebAdministration module imported OK."
            Write-Host "IIS drive exists? " -NoNewline
            Write-Host (Test-Path "IIS:\")
          } catch {
            Write-Host "Failed to import WebAdministration: $($_.Exception.Message)"
          }
          Write-Host ""

          Write-Host "=== IIS OBJECT LOOKUP (LOCAL MACHINE) ==="
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          try {
            if (Test-Path "IIS:\Sites\$siteName") {
              Write-Host "Found site: IIS:\Sites\$siteName"
              Get-Item "IIS:\Sites\$siteName" | Select-Object Name, State, PhysicalPath | Format-List
            } else {
              Write-Host "Site NOT found on this machine: IIS:\Sites\$siteName"
            }
          } catch {
            Write-Host "Error looking up site: $($_.Exception.Message)"
          }

          try {
            if (Test-Path "IIS:\AppPools\$appPool") {
              Write-Host "Found app pool: IIS:\AppPools\$appPool"
              Get-Item "IIS:\AppPools\$appPool" | Select-Object Name, State, AutoStart, ManagedRuntimeVersion | Format-List
            } else {
              Write-Host "App pool NOT found on this machine: IIS:\AppPools\$appPool"
            }
          } catch {
            Write-Host "Error looking up app pool: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "=== END DIAGNOSTICS ==="

      # ---------------------------------------------------------
      # STOP IIS LOCAL
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool (dev/stage local)
        if: ${{ env.DEPLOY_ENV == 'dev' || env.DEPLOY_ENV == 'stage' }}
        shell: powershell
        run: |
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          Import-Module WebAdministration
          Stop-WebAppPool -Name $appPool -ErrorAction SilentlyContinue
          Stop-Website -Name $siteName -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3
          exit 0

      # ---------------------------------------------------------
      # STOP IIS REMOTE
      # ---------------------------------------------------------
      - name: Stop IIS (SCM remote stop)
        if: ${{ env.DEPLOY_ENV == 'test' || env.DEPLOY_ENV == 'prod' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ steps.envmap.outputs.DEPLOY_USER }}
          DEPLOY_PASS: ${{ steps.envmap.outputs.DEPLOY_PASS }}
        run: |
          $remote = "${{ steps.envmap.outputs.REMOTE_SERVER }}"

          if ([string]::IsNullOrWhiteSpace($remote)) {
            throw "REMOTE_SERVER is missing or empty."
          }

          Write-Host "Stopping IIS core services on $remote ..."

          sc.exe \\$remote stop W3SVC
          sc.exe \\$remote stop WAS

          Start-Sleep -Seconds 5

          $w3svcState = sc.exe \\$remote query W3SVC | Select-String "STATE"
          $wasState   = sc.exe \\$remote query WAS   | Select-String "STATE"

          if ($w3svcState -notmatch "STOPPED") {
            throw "W3SVC did not stop properly"
          }
          if ($wasState -notmatch "STOPPED") {
            throw "WAS did not stop properly"
          }

          Write-Host "IIS successfully stopped via SCM."
          exit 0

      # ---------------------------------------------------------
      # DEPLOY
      # ---------------------------------------------------------
      - name: Deploy build output
        shell: powershell
        run: |
          function Invoke-NetUse {
            param(
              [Parameter(Mandatory = $true)][string]$Drive,
              [Parameter(Mandatory = $true)][string]$Share,
              [Parameter(Mandatory = $true)][string]$Username,
              [Parameter(Mandatory = $true)][string]$Password
            )

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = "net.exe"
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true

            $null = $psi.ArgumentList.Add("use")
            $null = $psi.ArgumentList.Add($Drive)
            $null = $psi.ArgumentList.Add($Share)
            $null = $psi.ArgumentList.Add($Password)
            $null = $psi.ArgumentList.Add("/user:$Username")
            $null = $psi.ArgumentList.Add("/persistent:no")

            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = $psi
            [void]$proc.Start()

            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            $proc.WaitForExit()

            if ($stdout) { Write-Host $stdout.Trim() }
            if ($stderr) { Write-Host $stderr.Trim() }

            if ($proc.ExitCode -ne 0) {
              throw "net use failed for drive $Drive -> $Share (exit code $($proc.ExitCode))"
            }
          }

          function Remove-NetUse {
            param(
              [Parameter(Mandatory = $true)][string]$Drive
            )

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = "net.exe"
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true

            $null = $psi.ArgumentList.Add("use")
            $null = $psi.ArgumentList.Add($Drive)
            $null = $psi.ArgumentList.Add("/delete")
            $null = $psi.ArgumentList.Add("/y")

            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = $psi
            [void]$proc.Start()

            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            $proc.WaitForExit()

            if ($stdout) { Write-Host $stdout.Trim() }
            if ($stderr) { Write-Host $stderr.Trim() }
          }

          $branch = '${{ env.DEPLOY_ENV }}'
          $source = "$(Get-Location)\build_output"
          $destination = '${{ steps.envmap.outputs.DEST_PATH }}'
          $deployUser = '${{ steps.envmap.outputs.DEPLOY_USER }}'
          $deployPass = '${{ steps.envmap.outputs.DEPLOY_PASS }}'

          $destDrive = 'Z:'

          try {
            if ($branch -eq 'test' -or $branch -eq 'prod') {
              Write-Host 'Mapping deployment share using net.exe with ArgumentList...'

              if ([string]::IsNullOrWhiteSpace($deployUser) -or [string]::IsNullOrWhiteSpace($deployPass)) {
                throw "DEPLOY_USER or DEPLOY_PASS is missing."
              }

              if (-not $destination.StartsWith('\\')) {
                throw "DEST_PATH must be a UNC path for test/prod."
              }

              $destParts = $destination -split '\\'
              if ($destParts.Length -lt 4) {
                throw "DEST_PATH is not a valid UNC path: $destination"
              }

              $destShareRoot = '\\' + $destParts[2] + '\' + $destParts[3]

              Write-Host "Destination share root: $destShareRoot"

              Remove-NetUse -Drive $destDrive
              Invoke-NetUse -Drive $destDrive -Share $destShareRoot -Username $deployUser -Password $deployPass

              $mappedDest = $destination.Replace($destShareRoot, $destDrive)
            }
            else {
              $mappedDest = $destination
            }

            Write-Host "Deploying from: $source"
            Write-Host "Deploying to:   $mappedDest"

            robocopy $source $mappedDest /MIR /XF web.config

            if ($LASTEXITCODE -ge 8) {
              throw "Robocopy deployment failed."
            }

            exit 0
          }
          finally {
            if ($branch -eq 'test' -or $branch -eq 'prod') {
              Remove-NetUse -Drive $destDrive
            }
          }

      # ---------------------------------------------------------
      # START IIS LOCAL
      # ---------------------------------------------------------
      - name: Start IIS local
        if: ${{ env.DEPLOY_ENV == 'dev' || env.DEPLOY_ENV == 'stage' }}
        shell: powershell
        run: |
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          Import-Module WebAdministration
          Start-WebAppPool -Name $appPool
          Start-Website -Name $siteName

          exit 0

      # ---------------------------------------------------------
      # START IIS REMOTE
      # ---------------------------------------------------------
      - name: Start IIS site and app pool (remote via SCM)
        if: ${{ env.DEPLOY_ENV == 'test' || env.DEPLOY_ENV == 'prod' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ steps.envmap.outputs.DEPLOY_USER }}
          DEPLOY_PASS: ${{ steps.envmap.outputs.DEPLOY_PASS }}
        run: |
          $remote   = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          if ([string]::IsNullOrWhiteSpace($remote)) {
            throw "REMOTE_SERVER is missing or empty."
          }

          Write-Host "Starting IIS core services on $remote ..."
          Write-Host "Target site: $siteName"
          Write-Host "Target app pool: $appPool"

          sc.exe \\$remote start WAS
          sc.exe \\$remote start W3SVC

          Start-Sleep -Seconds 5

          $w3svcState = sc.exe \\$remote query W3SVC | Select-String "STATE"
          $wasState   = sc.exe \\$remote query WAS   | Select-String "STATE"

          if ($w3svcState -notmatch "RUNNING") {
            throw "W3SVC did not start properly"
          }
          if ($wasState -notmatch "RUNNING") {
            throw "WAS did not start properly"
          }

          Write-Host "IIS core services successfully started via SCM."
          exit 0
