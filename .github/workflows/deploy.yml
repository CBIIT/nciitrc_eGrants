name: eGrants Deployment Workflow

on:
  # ---------------------------------------------------------
  # AUTOMATIC DEPLOYMENTS
  # ---------------------------------------------------------
  # Pushes to dev and test automatically deploy to those environments.
  push:
    branches:
      - dev
      - test

  # ---------------------------------------------------------
  # MANUAL DEPLOYMENTS
  # ---------------------------------------------------------
  # Used to deploy to an environment manually, including stage/prod.
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
        default: dev

# ---------------------------------------------------------
# GLOBAL ENVIRONMENT RESOLUTION
# ---------------------------------------------------------
# If this is a manual workflow_dispatch run, use the selected input.
# Otherwise, use the pushed branch name.
#
# Examples:
# - push to dev  => DEPLOY_ENV=dev
# - push to test => DEPLOY_ENV=test
# - manual prod  => DEPLOY_ENV=prod
env:
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

jobs:
  build-and-deploy:
    # ---------------------------------------------------------
    # RUNNER SELECTION
    # ---------------------------------------------------------
    # dev/test use the non-prod runner
    # stage/prod use the prod runner
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target_branch == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target_branch == 'test') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev') || (github.event_name != 'workflow_dispatch' && github.ref_name == 'test')) && 'egrants_fcas-oasys_runner' || 'egrants_fcas-oasys_runner_prod' }}

    # ---------------------------------------------------------
    # GITHUB ENVIRONMENT SELECTION
    # ---------------------------------------------------------
    # This allows environment-level secrets/protection rules to apply.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

    steps:
      # ---------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # LOAD ENVIRONMENT VARIABLES
      # ---------------------------------------------------------
      # Resolve the environment-specific values used later in the job.
      # Note: secrets are intentionally NOT written to GITHUB_OUTPUT.
      - name: Load environment variables
        id: envmap
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $branch = "${{ env.DEPLOY_ENV }}"
          if ([string]::IsNullOrWhiteSpace($branch)) {
            throw "DEPLOY_ENV resolved to an empty value."
          }

          Write-Host "Environment detected: $branch"

          switch ($branch) {
            "dev" {
              echo "DEST_PATH=${{ vars.DEST_PATH_DEV }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_DEV }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_DEV }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_DEV }}" >> $env:GITHUB_OUTPUT
            }
            "test" {
              echo "DEST_PATH=${{ vars.DEST_PATH_TEST }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_TEST }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_TEST }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_TEST }}" >> $env:GITHUB_OUTPUT
            }
            "stage" {
              echo "DEST_PATH=${{ vars.DEST_PATH_STAGE }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_STAGE }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_STAGE }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_STAGE }}" >> $env:GITHUB_OUTPUT
            }
            "prod" {
              echo "DEST_PATH=${{ vars.DEST_PATH_PROD }}" >> $env:GITHUB_OUTPUT
              echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH_PROD }}" >> $env:GITHUB_OUTPUT
              echo "SITE_NAME=${{ vars.SITE_NAME_PROD }}" >> $env:GITHUB_OUTPUT
              echo "APP_POOL=${{ vars.APP_POOL_PROD }}" >> $env:GITHUB_OUTPUT
            }
            default {
              throw "Unsupported deployment environment: $branch"
            }
          }

          echo "REMOTE_SERVER=${{ vars.REMOTE_SERVER }}" >> $env:GITHUB_OUTPUT
          exit 0

      # ---------------------------------------------------------
      # BUILD APPLICATION
      # ---------------------------------------------------------
      - name: Build project
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          dotnet restore "./source-aspnet/eGrants/eGrants.csproj"

          dotnet publish "./source-aspnet/eGrants/eGrants.csproj" `
            -c Release `
            -o ./build_output

      # ---------------------------------------------------------
      # REPLACE GITHUB TOKEN IN APPSETTINGS
      # ---------------------------------------------------------
      - name: Replace GitHubToken value with secret
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $file = "$(Get-Location)\build_output\appsettings.json"
          $token = "${{ secrets._GITHUB_TOKEN }}"

          if (-not (Test-Path $file)) {
            throw "appsettings.json not found at: $file"
          }

          $json = Get-Content $file -Raw
          $pattern = '"GitHubToken"\s*:\s*".*?"'
          $replacement = '"GitHubToken": "' + $token + '"'
          $json = $json -replace $pattern, $replacement

          Set-Content -Path $file -Value $json -Encoding UTF8

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE (DEV/STAGE)
      # ---------------------------------------------------------
      # For dev/stage, the destination is assumed to be reachable
      # directly from the runner without mapping a credentialed share.
      - name: Archive existing destination directory (dev/stage)
        if: ${{ env.DEPLOY_ENV == 'dev' || env.DEPLOY_ENV == 'stage' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-RobocopyChecked {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination,
              [Parameter(Mandatory = $false)][string[]]$Arguments = @('/MIR'),
              [Parameter(Mandatory = $false)][int]$MaxAttempts = 3,
              [Parameter(Mandatory = $false)][int]$DelaySeconds = 5
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              & robocopy $Source $Destination @Arguments
              $code = $LASTEXITCODE

              if ($code -lt 8) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Write-Host "Robocopy failed with exit code $code. Retrying in $DelaySeconds seconds (attempt $attempt of $MaxAttempts)..."
                Start-Sleep -Seconds $DelaySeconds
              } else {
                throw "Robocopy failed after $MaxAttempts attempts. Final exit code: $code"
              }
            }
          }

          $branch = '${{ env.DEPLOY_ENV }}'
          $destination = '${{ steps.envmap.outputs.DEST_PATH }}'
          $archiveRoot = '${{ steps.envmap.outputs.ARCHIVE_PATH }}'

          if ([string]::IsNullOrWhiteSpace($destination)) { throw "DEST_PATH is empty." }
          if ([string]::IsNullOrWhiteSpace($archiveRoot)) { throw "ARCHIVE_PATH is empty." }

          Write-Host "Environment: $branch"
          Write-Host "Destination UNC: $destination"
          Write-Host "Archive UNC: $archiveRoot"
          Write-Host "DEV or STAGE environment detected — no credentialed net use required."

          if (-not (Test-Path $destination)) {
            throw "Destination share not reachable: $destination"
          }

          if (-not (Test-Path $archiveRoot)) {
            New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null
          }

          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
          $localTemp = Join-Path $env:TEMP "archive_$timestamp"
          $localZip  = Join-Path $env:TEMP "archive_$timestamp.zip"
          $remoteZip = Join-Path $archiveRoot "backup_$timestamp.zip"

          New-Item -ItemType Directory -Path $localTemp -Force | Out-Null

          Invoke-RobocopyChecked -Source $destination -Destination $localTemp -Arguments @('/MIR')

          Compress-Archive -Path "$localTemp\*" -DestinationPath $localZip -Force
          Copy-Item -Path $localZip -Destination $remoteZip -Force

          Remove-Item -Path $localTemp -Recurse -Force
          Remove-Item -Path $localZip -Force

          $archives = Get-ChildItem -Path $archiveRoot -Filter 'backup_*.zip' | Sort-Object LastWriteTime -Descending
          $archivesToDelete = $archives | Select-Object -Skip 5
          foreach ($old in $archivesToDelete) {
            Remove-Item -Path $old.FullName -Force
          }

          exit 0

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE (TEST/PROD)
      # ---------------------------------------------------------
      # For test/prod, remote shares are mapped using credentials.
      # Password handling remains hardened against special characters.
      - name: Archive existing destination directory (test/prod)
        if: ${{ env.DEPLOY_ENV == 'test' || env.DEPLOY_ENV == 'prod' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_USER_TEST || secrets.DEPLOY_USER_PROD }}
          DEPLOY_PASS: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_PASS_TEST || secrets.DEPLOY_PASS_PROD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-NetworkDriveIfExists {
            param([Parameter(Mandatory = $true)][string]$DriveLetter)

            # Cleanup only. No password is passed here, so cmd.exe is safe.
            cmd.exe /d /c "net use $DriveLetter /delete /y >nul 2>&1"
            $global:LASTEXITCODE = 0
          }

          function Get-ShareRootFromUnc {
            param([Parameter(Mandatory = $true)][string]$UncPath)

            if ([string]::IsNullOrWhiteSpace($UncPath) -or -not $UncPath.StartsWith('\\')) {
              throw "Invalid UNC path: $UncPath"
            }

            $parts = $UncPath -split '\\'
            if ($parts.Count -lt 4 -or [string]::IsNullOrWhiteSpace($parts[2]) -or [string]::IsNullOrWhiteSpace($parts[3])) {
              throw "Unable to determine share root from UNC path: $UncPath"
            }

            return '\\' + $parts[2] + '\' + $parts[3]
          }

          function Mount-NetworkDrive {
            param(
              [Parameter(Mandatory = $true)][string]$DriveLetter,
              [Parameter(Mandatory = $true)][string]$ShareRoot,
              [Parameter(Mandatory = $true)][string]$Username,
              [Parameter(Mandatory = $true)][string]$Password,
              [Parameter(Mandatory = $false)][int]$MaxAttempts = 3,
              [Parameter(Mandatory = $false)][int]$DelaySeconds = 5
            )

            Remove-NetworkDriveIfExists $DriveLetter

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              # Direct net use invocation avoids cmd.exe mangling special characters
              # in the password, such as %.
              & net use $DriveLetter "$ShareRoot" /user:"$Username" "$Password" /persistent:no
              $code = $LASTEXITCODE

              if ($code -eq 0) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Write-Host "net use failed for $ShareRoot with exit code $code. Retrying in $DelaySeconds seconds (attempt $attempt of $MaxAttempts)..."
                Start-Sleep -Seconds $DelaySeconds
                Remove-NetworkDriveIfExists $DriveLetter
              } else {
                throw "Failed to map share $ShareRoot to drive $DriveLetter after $MaxAttempts attempts. Final exit code: $code"
              }
            }
          }

          function Invoke-RobocopyChecked {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination,
              [Parameter(Mandatory = $false)][string[]]$Arguments = @('/MIR'),
              [Parameter(Mandatory = $false)][int]$MaxAttempts = 3,
              [Parameter(Mandatory = $false)][int]$DelaySeconds = 5
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              & robocopy $Source $Destination @Arguments
              $code = $LASTEXITCODE

              if ($code -lt 8) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Write-Host "Robocopy failed with exit code $code. Retrying in $DelaySeconds seconds (attempt $attempt of $MaxAttempts)..."
                Start-Sleep -Seconds $DelaySeconds
              } else {
                throw "Robocopy failed after $MaxAttempts attempts. Final exit code: $code"
              }
            }
          }

          $branch = '${{ env.DEPLOY_ENV }}'
          $destination = '${{ steps.envmap.outputs.DEST_PATH }}'
          $archiveRoot = '${{ steps.envmap.outputs.ARCHIVE_PATH }}'
          $deployUser = $env:DEPLOY_USER
          $deployPass = $env:DEPLOY_PASS

          if ([string]::IsNullOrWhiteSpace($destination)) { throw "DEST_PATH is empty." }
          if ([string]::IsNullOrWhiteSpace($archiveRoot)) { throw "ARCHIVE_PATH is empty." }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { throw "DEPLOY_USER is empty." }
          if ([string]::IsNullOrWhiteSpace($deployPass)) { throw "DEPLOY_PASS is empty." }

          $destDrive = 'Z:'
          $archDrive = 'Y:'

          Write-Host "Environment: $branch"
          Write-Host "Destination UNC: $destination"
          Write-Host "Archive UNC: $archiveRoot"
          Write-Host "Mapping remote shares using credentials..."

          $destShareRoot = Get-ShareRootFromUnc $destination
          $archShareRoot = Get-ShareRootFromUnc $archiveRoot

          Write-Host "Destination share root: $destShareRoot"
          Write-Host "Archive share root: $archShareRoot"

          Mount-NetworkDrive -DriveLetter $destDrive -ShareRoot $destShareRoot -Username $deployUser -Password $deployPass
          Mount-NetworkDrive -DriveLetter $archDrive -ShareRoot $archShareRoot -Username $deployUser -Password $deployPass

          try {
            $mappedDest = $destination.Replace($destShareRoot, $destDrive)
            $mappedArchive = $archiveRoot.Replace($archShareRoot, $archDrive)

            Write-Host "Mapped destination path: $mappedDest"
            Write-Host "Mapped archive path: $mappedArchive"

            if (-not (Test-Path $mappedDest)) {
              throw "Destination share not reachable: $mappedDest"
            }

            if (-not (Test-Path $mappedArchive)) {
              New-Item -ItemType Directory -Path $mappedArchive -Force | Out-Null
            }

            $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
            $localTemp = Join-Path $env:TEMP "archive_$timestamp"
            $localZip  = Join-Path $env:TEMP "archive_$timestamp.zip"
            $remoteZip = Join-Path $mappedArchive "backup_$timestamp.zip"

            New-Item -ItemType Directory -Path $localTemp -Force | Out-Null

            Invoke-RobocopyChecked -Source $mappedDest -Destination $localTemp -Arguments @('/MIR')

            Compress-Archive -Path "$localTemp\*" -DestinationPath $localZip -Force
            Copy-Item -Path $localZip -Destination $remoteZip -Force

            Remove-Item -Path $localTemp -Recurse -Force
            Remove-Item -Path $localZip -Force

            $archives = Get-ChildItem -Path $mappedArchive -Filter 'backup_*.zip' | Sort-Object LastWriteTime -Descending
            $archivesToDelete = $archives | Select-Object -Skip 5
            foreach ($old in $archivesToDelete) {
              Remove-Item -Path $old.FullName -Force
            }
          }
          finally {
            Remove-NetworkDriveIfExists $destDrive
            Remove-NetworkDriveIfExists $archDrive
          }

          exit 0

      # ---------------------------------------------------------
      # DIAGNOSTICS
      # ---------------------------------------------------------
      # Useful for troubleshooting runner identity, IIS visibility,
      # and environment resolution.
      - name: Diagnostics (runner host + IIS visibility)
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host "=== BASIC CONTEXT ==="
          Write-Host "DEPLOY_ENV                = ${{ env.DEPLOY_ENV }}"
          Write-Host "github.event_name         = ${{ github.event_name }}"
          Write-Host "github.ref_name           = ${{ github.ref_name }}"
          Write-Host "github.repository         = ${{ github.repository }}"
          Write-Host "github.run_id             = ${{ github.run_id }}"
          Write-Host "github.run_number         = ${{ github.run_number }}"
          Write-Host "runner.name               = ${{ runner.name }}"
          Write-Host "runner.os                 = ${{ runner.os }}"
          Write-Host "runner.arch               = ${{ runner.arch }}"
          Write-Host "COMPUTERNAME              = $env:COMPUTERNAME"
          Write-Host "USERNAME                  = $env:USERNAME"
          Write-Host "USERDOMAIN                = $env:USERDOMAIN"
          Write-Host "PROCESS whoami            = $(whoami)"
          Write-Host "PowerShell version        = $($PSVersionTable.PSVersion)"
          Write-Host ""

          Write-Host "=== ENV OUTPUTS (FROM envmap) ==="
          Write-Host "SITE_NAME                 = '${{ steps.envmap.outputs.SITE_NAME }}'"
          Write-Host "APP_POOL                  = '${{ steps.envmap.outputs.APP_POOL }}'"
          Write-Host "DEST_PATH                 = '${{ steps.envmap.outputs.DEST_PATH }}'"
          Write-Host "ARCHIVE_PATH              = '${{ steps.envmap.outputs.ARCHIVE_PATH }}'"
          Write-Host "REMOTE_SERVER             = '${{ steps.envmap.outputs.REMOTE_SERVER }}'"
          Write-Host ""

          Write-Host "=== IIS SERVICES (LOCAL MACHINE) ==="
          try {
            Get-Service W3SVC, WAS -ErrorAction Stop | Format-Table Name, Status, StartType
          } catch {
            Write-Host "Unable to query W3SVC/WAS services: $($_.Exception.Message)"
          }
          Write-Host ""

          Write-Host "=== IIS PROVIDER CHECK ==="
          try {
            Import-Module WebAdministration -ErrorAction Stop
            Write-Host "WebAdministration module imported OK."
            Write-Host "IIS drive exists? " -NoNewline
            Write-Host (Test-Path "IIS:\")
          } catch {
            Write-Host "Failed to import WebAdministration: $($_.Exception.Message)"
          }
          Write-Host ""

          Write-Host "=== IIS OBJECT LOOKUP (LOCAL MACHINE) ==="
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          try {
            if (Test-Path "IIS:\Sites\$siteName") {
              Write-Host "Found site: IIS:\Sites\$siteName"
              Get-Item "IIS:\Sites\$siteName" | Select-Object Name, State, PhysicalPath | Format-List
            } else {
              Write-Host "Site NOT found on this machine: IIS:\Sites\$siteName"
            }
          } catch {
            Write-Host "Error looking up site: $($_.Exception.Message)"
          }

          try {
            if (Test-Path "IIS:\AppPools\$appPool") {
              Write-Host "Found app pool: IIS:\AppPools\$appPool"
              Get-Item "IIS:\AppPools\$appPool" | Select-Object Name, State, AutoStart, ManagedRuntimeVersion | Format-List
            } else {
              Write-Host "App pool NOT found on this machine: IIS:\AppPools\$appPool"
            }
          } catch {
            Write-Host "Error looking up app pool: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "=== END DIAGNOSTICS ==="

      # ---------------------------------------------------------
      # STOP IIS LOCAL (DEV/STAGE)
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool (dev/stage local)
        if: ${{ env.DEPLOY_ENV == 'dev' || env.DEPLOY_ENV == 'stage' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          if ([string]::IsNullOrWhiteSpace($siteName)) { throw "SITE_NAME is empty." }
          if ([string]::IsNullOrWhiteSpace($appPool)) { throw "APP_POOL is empty." }

          Import-Module WebAdministration

          Stop-WebAppPool -Name $appPool -ErrorAction SilentlyContinue
          Stop-Website -Name $siteName -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3
          exit 0

      # ---------------------------------------------------------
      # STOP IIS REMOTE (TEST/PROD)
      # ---------------------------------------------------------
      # Intentionally uses the older SCM logic you asked to keep.
      # This means it may still display Access Denied from sc.exe and
      # later report success based on the query output.
      - name: Stop IIS (SCM remote stop)
        if: ${{ env.DEPLOY_ENV == 'test' || env.DEPLOY_ENV == 'prod' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_USER_TEST || secrets.DEPLOY_USER_PROD }}
          DEPLOY_PASS: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_PASS_TEST || secrets.DEPLOY_PASS_PROD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $remote = "${{ steps.envmap.outputs.REMOTE_SERVER }}"

          if ([string]::IsNullOrWhiteSpace($remote)) {
            throw "REMOTE_SERVER is missing or empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_USER) -or [string]::IsNullOrWhiteSpace($env:DEPLOY_PASS)) {
            throw "DEPLOY_USER or DEPLOY_PASS is missing for remote stop operation."
          }

          Write-Host "Stopping IIS core services on $remote ..."

          sc.exe \\$remote stop W3SVC
          sc.exe \\$remote stop WAS

          Start-Sleep -Seconds 5

          $w3svcState = sc.exe \\$remote query W3SVC | Select-String "STATE"
          $wasState   = sc.exe \\$remote query WAS   | Select-String "STATE"

          if ($w3svcState -notmatch "STOPPED") {
            throw "W3SVC did not stop properly"
          }
          if ($wasState -notmatch "STOPPED") {
            throw "WAS did not stop properly"
          }

          Write-Host "IIS successfully stopped via SCM."
          exit 0

      # ---------------------------------------------------------
      # DEPLOY BUILD OUTPUT (DEV/STAGE)
      # ---------------------------------------------------------
      - name: Deploy build output (dev/stage)
        if: ${{ env.DEPLOY_ENV == 'dev' || env.DEPLOY_ENV == 'stage' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-RobocopyChecked {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination,
              [Parameter(Mandatory = $false)][string[]]$Arguments = @('/MIR', '/XF', 'web.config'),
              [Parameter(Mandatory = $false)][int]$MaxAttempts = 3,
              [Parameter(Mandatory = $false)][int]$DelaySeconds = 5
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              & robocopy $Source $Destination @Arguments
              $code = $LASTEXITCODE

              if ($code -lt 8) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Write-Host "Robocopy failed with exit code $code. Retrying in $DelaySeconds seconds (attempt $attempt of $MaxAttempts)..."
                Start-Sleep -Seconds $DelaySeconds
              } else {
                throw "Robocopy failed after $MaxAttempts attempts. Final exit code: $code"
              }
            }
          }

          $source = "$(Get-Location)\build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          if (-not (Test-Path $source)) { throw "Build output folder not found: $source" }
          if ([string]::IsNullOrWhiteSpace($destination)) { throw "DEST_PATH is empty." }

          Invoke-RobocopyChecked -Source $source -Destination $destination
          exit 0

      # ---------------------------------------------------------
      # DEPLOY BUILD OUTPUT (TEST/PROD)
      # ---------------------------------------------------------
      - name: Deploy build output (test/prod)
        if: ${{ env.DEPLOY_ENV == 'test' || env.DEPLOY_ENV == 'prod' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_USER_TEST || secrets.DEPLOY_USER_PROD }}
          DEPLOY_PASS: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_PASS_TEST || secrets.DEPLOY_PASS_PROD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-NetworkDriveIfExists {
            param([Parameter(Mandatory = $true)][string]$DriveLetter)
            cmd.exe /d /c "net use $DriveLetter /delete /y >nul 2>&1"
            $global:LASTEXITCODE = 0
          }

          function Get-ShareRootFromUnc {
            param([Parameter(Mandatory = $true)][string]$UncPath)

            if ([string]::IsNullOrWhiteSpace($UncPath) -or -not $UncPath.StartsWith('\\')) {
              throw "Invalid UNC path: $UncPath"
            }

            $parts = $UncPath -split '\\'
            if ($parts.Count -lt 4 -or [string]::IsNullOrWhiteSpace($parts[2]) -or [string]::IsNullOrWhiteSpace($parts[3])) {
              throw "Unable to determine share root from UNC path: $UncPath"
            }

            return '\\' + $parts[2] + '\' + $parts[3]
          }

          function Mount-NetworkDrive {
            param(
              [Parameter(Mandatory = $true)][string]$DriveLetter,
              [Parameter(Mandatory = $true)][string]$ShareRoot,
              [Parameter(Mandatory = $true)][string]$Username,
              [Parameter(Mandatory = $true)][string]$Password,
              [Parameter(Mandatory = $false)][int]$MaxAttempts = 3,
              [Parameter(Mandatory = $false)][int]$DelaySeconds = 5
            )

            Remove-NetworkDriveIfExists $DriveLetter

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              & net use $DriveLetter "$ShareRoot" /user:"$Username" "$Password" /persistent:no
              $code = $LASTEXITCODE

              if ($code -eq 0) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Write-Host "net use failed for $ShareRoot with exit code $code. Retrying in $DelaySeconds seconds (attempt $attempt of $MaxAttempts)..."
                Start-Sleep -Seconds $DelaySeconds
                Remove-NetworkDriveIfExists $DriveLetter
              } else {
                throw "Failed to map share $ShareRoot to drive $DriveLetter after $MaxAttempts attempts. Final exit code: $code"
              }
            }
          }

          function Invoke-RobocopyChecked {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination,
              [Parameter(Mandatory = $false)][string[]]$Arguments = @('/MIR', '/XF', 'web.config'),
              [Parameter(Mandatory = $false)][int]$MaxAttempts = 3,
              [Parameter(Mandatory = $false)][int]$DelaySeconds = 5
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              & robocopy $Source $Destination @Arguments
              $code = $LASTEXITCODE

              if ($code -lt 8) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Write-Host "Robocopy failed with exit code $code. Retrying in $DelaySeconds seconds (attempt $attempt of $MaxAttempts)..."
                Start-Sleep -Seconds $DelaySeconds
              } else {
                throw "Robocopy failed after $MaxAttempts attempts. Final exit code: $code"
              }
            }
          }

          $source = "$(Get-Location)\build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $deployUser = $env:DEPLOY_USER
          $deployPass = $env:DEPLOY_PASS
          $destDrive = 'Z:'

          if (-not (Test-Path $source)) { throw "Build output folder not found: $source" }
          if ([string]::IsNullOrWhiteSpace($destination)) { throw "DEST_PATH is empty." }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { throw "DEPLOY_USER is empty." }
          if ([string]::IsNullOrWhiteSpace($deployPass)) { throw "DEPLOY_PASS is empty." }

          $destShareRoot = Get-ShareRootFromUnc $destination
          Write-Host "Destination share root: $destShareRoot"

          Mount-NetworkDrive -DriveLetter $destDrive -ShareRoot $destShareRoot -Username $deployUser -Password $deployPass

          try {
            $mappedDest = $destination.Replace($destShareRoot, $destDrive)
            Write-Host "Mapped destination path: $mappedDest"

            if (-not (Test-Path $mappedDest)) {
              throw "Destination share not reachable: $mappedDest"
            }

            Invoke-RobocopyChecked -Source $source -Destination $mappedDest
          }
          finally {
            Remove-NetworkDriveIfExists $destDrive
          }

          exit 0

      # ---------------------------------------------------------
      # START IIS LOCAL (DEV/STAGE)
      # ---------------------------------------------------------
      - name: Start IIS local
        if: ${{ env.DEPLOY_ENV == 'dev' || env.DEPLOY_ENV == 'stage' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          if ([string]::IsNullOrWhiteSpace($siteName)) { throw "SITE_NAME is empty." }
          if ([string]::IsNullOrWhiteSpace($appPool)) { throw "APP_POOL is empty." }

          Import-Module WebAdministration

          Start-WebAppPool -Name $appPool
          Start-Website -Name $siteName

          exit 0

      # ---------------------------------------------------------
      # START IIS REMOTE (TEST/PROD)
      # ---------------------------------------------------------
      # Intentionally uses the older SCM logic you asked to keep.
      - name: Start IIS site and app pool (remote via SCM)
        if: ${{ env.DEPLOY_ENV == 'test' || env.DEPLOY_ENV == 'prod' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_USER_TEST || secrets.DEPLOY_USER_PROD }}
          DEPLOY_PASS: ${{ env.DEPLOY_ENV == 'test' && secrets.DEPLOY_PASS_TEST || secrets.DEPLOY_PASS_PROD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $remote   = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          if ([string]::IsNullOrWhiteSpace($remote)) {
            throw "REMOTE_SERVER is missing or empty."
          }

          Write-Host "Starting IIS core services on $remote ..."
          Write-Host "Target site: $siteName"
          Write-Host "Target app pool: $appPool"

          sc.exe \\$remote start WAS
          sc.exe \\$remote start W3SVC

          Start-Sleep -Seconds 5

          $w3svcState = sc.exe \\$remote query W3SVC | Select-String "STATE"
          $wasState   = sc.exe \\$remote query WAS   | Select-String "STATE"

          if ($w3svcState -notmatch "RUNNING") {
            throw "W3SVC did not start properly"
          }
          if ($wasState -notmatch "RUNNING") {
            throw "WAS did not start properly"
          }

          Write-Host "IIS core services successfully started via SCM."
          exit 0
