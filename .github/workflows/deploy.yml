name: eGrants Deployment Workflow

on:
  push:
    branches:
      - dev
      - test
      - stage
      - master

jobs:
  build-and-deploy:
    runs-on: egrants_fcas-oasys_runner
    environment: ${{ github.ref_name }}

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # LOAD ENVIRONMENT VARIABLES
      # ---------------------------------------------------------
      - name: Load environment variables
        id: envmap
        shell: powershell
        run: |
          echo "DEST_PATH=${{ vars.DEST_PATH }}" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH }}" >> $env:GITHUB_OUTPUT
          echo "SITE_NAME=${{ vars.SITE_NAME }}" >> $env:GITHUB_OUTPUT
          echo "APP_POOL=${{ vars.APP_POOL }}" >> $env:GITHUB_OUTPUT
          echo "REMOTE_SERVER=${{ vars.REMOTE_SERVER }}" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # LOAD GITHUB TOKEN
      # ---------------------------------------------------------
      - name: Load GitHub token
        id: token
        shell: powershell
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Build project
        shell: powershell
        run: |
          $project = "$PWD/source-aspnet/eGrants/eGrants.csproj"
          $output  = Join-Path $PWD "build_output"

          Write-Host "Project path: $project"
          Write-Host "Output path: $output"

          dotnet restore $project

          dotnet publish $project `
            -c Release `
            -o $output

          if (-not (Test-Path $output)) {
            throw "Build output folder was not created: $output"
          }

          Write-Host "Build output contents:"
          Get-ChildItem -Path $output

      # ---------------------------------------------------------
      # DEBUG (helps if anything breaks later)
      # ---------------------------------------------------------
      - name: Debug workspace
        shell: powershell
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Workspace contents:"
          Get-ChildItem -Path $PWD

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE
      # ---------------------------------------------------------
      - name: Archive existing destination directory
        shell: powershell
        run: |
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $archiveRoot = "${{ steps.envmap.outputs.ARCHIVE_PATH }}"

          if (-not (Test-Path $destination)) {
            throw "Destination share not reachable: $destination"
          }

          if (-not (Test-Path $archiveRoot)) {
            New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $localTemp = Join-Path $env:TEMP "archive_$timestamp"
          $localZip  = Join-Path $env:TEMP "archive_$timestamp.zip"
          $remoteZip = Join-Path $archiveRoot "backup_$timestamp.zip"

          New-Item -ItemType Directory -Path $localTemp | Out-Null

          robocopy $destination $localTemp /MIR
          if ($LASTEXITCODE -ge 8) { throw "Robocopy local copy failed." }

          Compress-Archive -Path "$localTemp\*" -DestinationPath $localZip -Force
          Copy-Item -Path $localZip -Destination $remoteZip -Force

          Remove-Item -Path $localTemp -Recurse -Force
          Remove-Item -Path $localZip -Force

          # Keep only latest 5 backups
          $archives = Get-ChildItem -Path $archiveRoot -Filter "backup_*.zip" |
                      Sort-Object LastWriteTime -Descending

          $archives | Select-Object -Skip 5 | ForEach-Object {
            Remove-Item $_.FullName -Force
          }

      # ---------------------------------------------------------
      # STOP IIS (DEV LOCAL)
      # ---------------------------------------------------------
      - name: Stop IIS (dev)
        if: ${{ github.ref_name == 'dev' }}
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          Stop-WebAppPool -Name $appPool -ErrorAction SilentlyContinue
          Stop-Website -Name $siteName -ErrorAction SilentlyContinue

      # ---------------------------------------------------------
      # DEPLOY FILES
      # ---------------------------------------------------------
      - name: Deploy build output
        shell: powershell
        run: |
          $source = Join-Path $PWD "build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          Write-Host "Deploying from: $source"
          Write-Host "Deploying to: $destination"

          if (-not (Test-Path $source)) {
            throw "Build output not found: $source"
          }

          if (-not (Test-Path $destination)) {
            throw "Destination not reachable: $destination"
          }

          robocopy $source $destination /MIR /XF web.config
          if ($LASTEXITCODE -ge 8) { throw "Robocopy deployment failed." }

      # ---------------------------------------------------------
      # START IIS (DEV LOCAL)
      # ---------------------------------------------------------
      - name: Start IIS (dev)
        if: ${{ github.ref_name == 'dev' }}
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          Start-WebAppPool -Name $appPool
          Start-Website -Name $siteName
