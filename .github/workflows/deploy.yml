name: eGrants Deployment Workflow

on:
  push:
    branches:
      - dev
      - test
      - stage
      - eGrants-Core-Main

jobs:
  build-and-deploy:
    runs-on: egrants_fcas-oasys_runner
    environment: ${{ github.ref_name }}

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # LOAD ENVIRONMENT VARIABLES
      # ---------------------------------------------------------
      - name: Load environment variables
        id: envmap
        shell: powershell
        run: |
          echo "DEST_PATH=${{ vars.DEST_PATH }}" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH }}" >> $env:GITHUB_OUTPUT
          echo "SITE_NAME=${{ vars.SITE_NAME }}" >> $env:GITHUB_OUTPUT
          echo "APP_POOL=${{ vars.APP_POOL }}" >> $env:GITHUB_OUTPUT
          echo "REMOTE_SERVER=${{ vars.REMOTE_SERVER }}" >> $env:GITHUB_OUTPUT
          exit 0

      # ---------------------------------------------------------
      # LOAD GITHUB TOKEN (kept as-is)
      # ---------------------------------------------------------
      - name: Load GitHub token
        id: token
        shell: powershell
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Build project
        shell: powershell
        run: |
          dotnet restore "./source-aspnet/eGrants/eGrants.csproj"
          dotnet publish "./source-aspnet/eGrants/eGrants.csproj" `
            -c Release `
            -o ./build_output
          exit 0

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE
      # ---------------------------------------------------------
      - name: Archive existing destination directory
        shell: powershell
        run: |
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $archiveRoot = "${{ steps.envmap.outputs.ARCHIVE_PATH }}"

          if (-not (Test-Path $destination)) {
            throw "Destination share not reachable: $destination"
          }

          if (-not (Test-Path $archiveRoot)) {
            New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $archivePath = Join-Path $archiveRoot "backup_$timestamp"

          New-Item -ItemType Directory -Path $archivePath | Out-Null
          robocopy $destination $archivePath /MIR
          if ($LASTEXITCODE -ge 8) { throw "Robocopy archive failed." }

          $zipFile = "$archivePath.zip"
          Compress-Archive -Path "$archivePath\*" -DestinationPath $zipFile -Force
          Remove-Item -Path $archivePath -Recurse -Force

          exit 0

      # ---------------------------------------------------------
      # STOP IIS (DEV LOCAL)
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool (dev/local)
        if: ${{ github.ref_name == 'dev' }}
        shell: powershell
        run: |
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          Import-Module WebAdministration

          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
            Stop-WebAppPool -Name $appPool -ErrorAction Stop
          }

          if ((Get-Website -Name $siteName).state -ne "Stopped") {
            Stop-Website -Name $siteName -ErrorAction Stop
          }

          Start-Sleep -Seconds 3

          if ((Get-Website -Name $siteName).state -ne "Stopped") {
            throw "IIS site did not stop properly: $siteName"
          }
          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
            throw "IIS app pool did not stop properly: $appPool"
          }

          exit 0

      # ---------------------------------------------------------
      # STOP IIS (NON-DEV REMOTE) — using PsExec from dev to test
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool (remote via PsExec)
        if: ${{ github.ref_name != 'dev' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}
          PSEXEC_PATH: ${{ secrets.PSEXEC_PATH }} # optional: full path to psexec.exe if not in PATH
        run: |
          $remote   = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          if (-not $env:DEPLOY_USER -or -not $env:DEPLOY_PASS) {
            throw "Missing DEPLOY_USER or DEPLOY_PASS environment variables."
          }

          # Locate psexec: prefer explicit secret, then PATH, then common locations
          $psexecPath = $null
          if ($env:PSEXEC_PATH) {
            $psexecPath = $env:PSEXEC_PATH
          } else {
            $cmd = Get-Command psexec.exe -ErrorAction SilentlyContinue
            if ($cmd) { $psexecPath = $cmd.Source }
            else {
              $candidates = @(
                "$env:ProgramFiles\PsTools\PsExec.exe",
                "$env:ProgramFiles(x86)\PsTools\PsExec.exe",
                "C:\PsTools\PsExec.exe",
                "C:\Tools\PsExec.exe"
              )
              foreach ($c in $candidates) { if (Test-Path $c) { $psexecPath = $c; break } }
            }
          }

          if (-not $psexecPath -or -not (Test-Path $psexecPath)) {
            throw "psexec.exe not found. Put PsExec on the runner PATH or set secret PSEXEC_PATH with the full path to psexec.exe."
          }

          Write-Host "Using PsExec at: $psexecPath"

          # Prepare remote script content
          $psCommand = @"
          Import-Module WebAdministration;
          if((Get-WebAppPoolState -Name '$appPool').Value -ne 'Stopped'){ Stop-WebAppPool -Name '$appPool' -ErrorAction Stop; }
          if((Get-Website -Name '$siteName').state -ne 'Stopped'){ Stop-Website -Name '$siteName' -ErrorAction Stop; }
          Start-Sleep -Seconds 3;
          if((Get-Website -Name '$siteName').state -ne 'Stopped'){ throw 'IIS site did not stop properly: $siteName' }
          if((Get-WebAppPoolState -Name '$appPool').Value -ne 'Stopped'){ throw 'IIS app pool did not stop properly: $appPool' }
          "@

          $tmpFileName = "stop_iis_$((Get-Date).ToString('yyyyMMddHHmmss')).ps1"
          $localTmp = Join-Path $env:TEMP $tmpFileName
          Set-Content -Path $localTmp -Value $psCommand -Encoding UTF8

          # Build PsExec argument array: -c copies local file to remote and executes it
          $args = @(
            "\\$remote",
            "-u", $env:DEPLOY_USER,
            "-p", $env:DEPLOY_PASS,
            "-accepteula",
            "-h",
            "-c", $localTmp,
            "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $tmpFileName
          )

          Write-Host "Executing PsExec to stop IIS on $remote"
          $proc = Start-Process -FilePath $psexecPath -ArgumentList $args -Wait -PassThru

          # Cleanup local temp script
          try { Remove-Item -Path $localTmp -Force -ErrorAction SilentlyContinue } catch {}

          if ($proc.ExitCode -ne 0) {
            throw "PsExec remote stop failed with exit code $($proc.ExitCode)."
          }

          exit 0

      # ---------------------------------------------------------
      # DEPLOY FILES
      # ---------------------------------------------------------
      - name: Deploy build output
        shell: powershell
        run: |
          $source = "$(Get-Location)\build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          if (-not (Test-Path $source)) { throw "Build output not found: $source" }
          if (-not (Test-Path $destination)) { throw "Destination share not reachable: $destination" }

          robocopy $source $destination /MIR /XF web.config
          if ($LASTEXITCODE -ge 8) { throw "Robocopy deployment failed." }

          exit 0

      # ---------------------------------------------------------
      # UPDATE APPSETTINGS.JSON (DEV LOCAL)
      # ---------------------------------------------------------
      - name: Update GitHubToken in destination appsettings.json (dev/local)
        if: ${{ github.ref_name == 'dev' }}
        shell: powershell
        run: |
          $token = "${{ secrets._GITHUB_TOKEN }}"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $appSettingsPath = Join-Path $destination "appsettings.json"

          if (-not (Test-Path $appSettingsPath)) {
            throw "Destination appsettings.json not found: $appSettingsPath"
          }

          $content = Get-Content $appSettingsPath -Raw
          $pattern = '"GitHubToken"\s*:\s*".*?"'
          $replacement = '"GitHubToken": "' + $token + '"'
          $newContent = [regex]::Replace($content, $pattern, $replacement)

          Set-Content -Path $appSettingsPath -Value $newContent -Encoding UTF8
          exit 0

      # ---------------------------------------------------------
      # UPDATE APPSETTINGS.JSON (NON-DEV REMOTE) — using PsExec
      # ---------------------------------------------------------
      - name: Update GitHubToken in destination appsettings.json (remote via PsExec)
        if: ${{ github.ref_name != 'dev' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}
        run: |
          $token = "${{ secrets._GITHUB_TOKEN }}"
          $remote = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          if (-not $env:DEPLOY_USER -or -not $env:DEPLOY_PASS) {
            throw "Missing DEPLOY_USER or DEPLOY_PASS environment variables."
          }

          $psexec = "psexec.exe"

          $psCommand = @"
          $appSettingsPath = Join-Path $destination 'appsettings.json'
          
          if (-not (Test-Path $appSettingsPath)) {
              throw "Destination appsettings.json not found: $appSettingsPath"
          }
          
          $content = Get-Content $appSettingsPath -Raw
          $pattern = '"GitHubToken"\s*:\s*".*?"'
          $replacement = '"GitHubToken": "{0}"' -f $token
          
          $newContent = [regex]::Replace($content, $pattern, $replacement)
          
          Set-Content -Path $appSettingsPath -Value $newContent -Encoding UTF8
          "@

          $tmpFileName = "update_appsettings_$((Get-Date).ToString('yyyyMMddHHmmss')).ps1"
          $tmpScript = Join-Path $env:TEMP $tmpFileName
          Set-Content -Path $tmpScript -Value $psCommand -Encoding UTF8

          $psexecArgs = "\\$remote -u $env:DEPLOY_USER -p $env:DEPLOY_PASS -accepteula -h -c `"$tmpScript`" powershell -NoProfile -ExecutionPolicy Bypass -File `"$tmpFileName`""
          Write-Host "Executing PsExec to update appsettings.json on $remote"
          Write-Host $psexecArgs

          $proc = Start-Process -FilePath $psexec -ArgumentList $psexecArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Remove-Item -Path $tmpScript -ErrorAction SilentlyContinue
            throw "PsExec remote update failed with exit code $($proc.ExitCode)"
          }

          Remove-Item -Path $tmpScript -Force -ErrorAction SilentlyContinue
          exit 0

      # ---------------------------------------------------------
      # START IIS (DEV LOCAL)
      # ---------------------------------------------------------
      - name: Start IIS site and app pool (dev/local)
        if: ${{ github.ref_name == 'dev' }}
        shell: powershell
        run: |
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          Import-Module WebAdministration

          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
            Start-WebAppPool -Name $appPool -ErrorAction Stop
          }

          if ((Get-Website -Name $siteName).state -ne "Started") {
            Start-Website -Name $siteName -ErrorAction Stop
          }

          Start-Sleep -Seconds 3

          if ((Get-Website -Name $siteName).state -ne "Started") {
            throw "IIS site did not start properly: $siteName"
          }
          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
            throw "IIS app pool did not start properly: $appPool"
          }

          exit 0

      # ---------------------------------------------------------
      # START IIS (NON-DEV REMOTE) — using PsExec
      # ---------------------------------------------------------
      - name: Start IIS site and app pool (remote via PsExec)
        if: ${{ github.ref_name != 'dev' }}
        shell: powershell
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}
        run: |
          $remote   = "${{ steps.envmap.outputs.REMOTE_SERVER }}"
          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool  = "${{ steps.envmap.outputs.APP_POOL }}"

          if (-not $env:DEPLOY_USER -or -not $env:DEPLOY_PASS) {
            throw "Missing DEPLOY_USER or DEPLOY_PASS environment variables."
          }

          $psexec = "psexec.exe"

          $psCommand = @"
          Import-Module WebAdministration
          
          if ((Get-WebAppPoolState -Name $appPool).Value -ne 'Started') {
              Start-WebAppPool -Name $appPool -ErrorAction Stop
          }
          
          if ((Get-Website -Name $siteName).state -ne 'Started') {
              Start-Website -Name $siteName -ErrorAction Stop
          }
          
          Start-Sleep -Seconds 3
          
          if ((Get-Website -Name $siteName).state -ne 'Started') {
              throw "IIS site did not start properly: $siteName"
          }
          
          if ((Get-WebAppPoolState -Name $appPool).Value -ne 'Started') {
              throw "IIS app pool did not start properly: $appPool"
          }
          "@

          $tmpFileName = "start_iis_$((Get-Date).ToString('yyyyMMddHHmmss')).ps1"
          $tmpScript = Join-Path $env:TEMP $tmpFileName
          Set-Content -Path $tmpScript -Value $psCommand -Encoding UTF8

          $psexecArgs = "\\$remote -u $env:DEPLOY_USER -p $env:DEPLOY_PASS -accepteula -h -c `"$tmpScript`" powershell -NoProfile -ExecutionPolicy Bypass -File `"$tmpFileName`""
          Write-Host "Executing PsExec to start IIS on $remote"
          Write-Host $psexecArgs

          $proc = Start-Process -FilePath $psexec -ArgumentList $psexecArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Remove-Item -Path $tmpScript -ErrorAction SilentlyContinue
            throw "PsExec remote start failed with exit code $($proc.ExitCode)"
          }

          Remove-Item -Path $tmpScript -Force -ErrorAction SilentlyContinue
          exit 0
