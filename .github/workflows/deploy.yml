name: eGrants Deployment Workflow

on:
  push:
    branches:
      - dev
      - test
      - stage
      - eGrants-Core-Main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: './source-aspnet/eGrants/eGrants.csproj'
  BUILD_OUTPUT: './build_output'

jobs:
  build-and-deploy:
    runs-on: egrants_fcas-oasys_runner
    environment: ${{ github.ref_name }}

    defaults:
      run:
        shell: powershell

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SETUP .NET
      # ---------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ---------------------------------------------------------
      # LOAD ENVIRONMENT VARIABLES
      # ---------------------------------------------------------
      - name: Load environment variables
        id: envmap
        run: |
          echo "DEST_PATH=${{ vars.DEST_PATH }}" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_PATH=${{ vars.ARCHIVE_PATH }}" >> $env:GITHUB_OUTPUT
          echo "SITE_NAME=${{ vars.SITE_NAME }}" >> $env:GITHUB_OUTPUT
          echo "APP_POOL=${{ vars.APP_POOL }}" >> $env:GITHUB_OUTPUT
          exit 0

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Build project
        id: build
        run: |
          try {
            dotnet restore "${{ env.PROJECT_PATH }}"
            dotnet publish "${{ env.PROJECT_PATH }}" `
              -c Release `
              -o "${{ env.BUILD_OUTPUT }}"
          }
          catch {
            Write-Error "Build failed: $($_.Exception.Message)"
            throw
          }
          exit 0

      # ---------------------------------------------------------
      # UPLOAD BUILD ARTIFACT
      # ---------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: egrants-build-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 14

      # ---------------------------------------------------------
      # ARCHIVE CURRENT SITE (ROLLBACK)
      # ---------------------------------------------------------
      - name: Archive existing destination directory
        id: archive
        run: |
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          $archiveRoot = "${{ steps.envmap.outputs.ARCHIVE_PATH }}"

          if (-not (Test-Path $destination)) {
            throw "Destination share not reachable: $destination"
          }

          if (-not (Test-Path $archiveRoot)) {
            New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $archivePath = Join-Path $archiveRoot "backup_$timestamp"

          try {
            Write-Host "Creating archive folder: $archivePath"
            New-Item -ItemType Directory -Path $archivePath | Out-Null

            Write-Host "Archiving current destination contents..."
            robocopy $destination $archivePath /MIR
            $exitCode = $LASTEXITCODE

            if ($exitCode -ge 8) {
              throw "Robocopy archive failed. Exit code: $exitCode"
            }

            $zipFile = "$archivePath.zip"
            Compress-Archive -Path "$archivePath\*" -DestinationPath $zipFile -Force
            Remove-Item -Path $archivePath -Recurse -Force

            echo "ROLLBACK_ZIP=$zipFile" >> $env:GITHUB_OUTPUT
          }
          catch {
            Write-Error "Archiving failed: $($_.Exception.Message)"
            throw
          }
          exit 0

      # ---------------------------------------------------------
      # STOP IIS
      # ---------------------------------------------------------
      - name: Stop IIS site and app pool
        run: |
          Import-Module WebAdministration

          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool = "${{ steps.envmap.outputs.APP_POOL }}"

          try {
            if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
              Stop-WebAppPool -Name $appPool -ErrorAction Stop
            }

            if ((Get-Website -Name $siteName).state -ne "Stopped") {
              Stop-Website -Name $siteName -ErrorAction Stop
            }

            Start-Sleep -Seconds 3
          }
          catch {
            Write-Error "Failed to stop IIS: $($_.Exception.Message)"
            throw
          }
          exit 0

      # ---------------------------------------------------------
      # DEPLOY FILES
      # ---------------------------------------------------------
      - name: Deploy build output
        id: deploy
        run: |
          $source = "$(Get-Location)\build_output"
          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"

          if (-not (Test-Path $source)) { throw "Build output not found: $source" }
          if (-not (Test-Path $destination)) { throw "Destination share not reachable: $destination" }

          try {
            robocopy $source $destination /MIR /XF web.config
            $exitCode = $LASTEXITCODE

            if ($exitCode -ge 8) {
              throw "Robocopy deployment failed. Exit code: $exitCode"
            }
          }
          catch {
            Write-Error "Deployment failed: $($_.Exception.Message)"
            throw
          }
          exit 0

      # ---------------------------------------------------------
      # START IIS
      # ---------------------------------------------------------
      - name: Start IIS site and app pool
        run: |
          Import-Module WebAdministration

          $siteName = "${{ steps.envmap.outputs.SITE_NAME }}"
          $appPool = "${{ steps.envmap.outputs.APP_POOL }}"

          try {
            if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
              Start-WebAppPool -Name $appPool -ErrorAction Stop
            }

            if ((Get-Website -Name $siteName).state -ne "Started") {
              Start-Website -Name $siteName -ErrorAction Stop
            }

            Start-Sleep -Seconds 3
          }
          catch {
            Write-Error "Failed to start IIS: $($_.Exception.Message)"
            throw
          }
          exit 0

      # ---------------------------------------------------------
      # VERSION TAGGING (MAIN ONLY)
      # ---------------------------------------------------------
      - name: Create version tag
        if: success() && github.ref_name == 'eGrants-Core-Main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          $shortSha = "${{ github.sha.Substring(0,7) }}"
          $tag = "release-$date-$shortSha"

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git tag $tag ${{ github.sha }}
          git push origin $tag
          exit 0

      # ---------------------------------------------------------
      # NOTIFY SUCCESS
      # ---------------------------------------------------------
      - name: Notify success
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          $payload = @{ text = "✅ Deployment succeeded on `${{ github.ref_name }}`" } | ConvertTo-Json
          Invoke-WebRequest -Uri $env:WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json'
          exit 0

      # ---------------------------------------------------------
      # ROLLBACK ON FAILURE
      # ---------------------------------------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          $zip = "${{ steps.archive.outputs.ROLLBACK_ZIP }}"
          if (-not $zip -or -not (Test-Path $zip)) {
            Write-Host "No rollback archive available."
            exit 0
          }

          $destination = "${{ steps.envmap.outputs.DEST_PATH }}"
          Import-Module WebAdministration

          try {
            Stop-WebAppPool -Name "${{ steps.envmap.outputs.APP_POOL }}" -ErrorAction SilentlyContinue
            Stop-Website -Name "${{ steps.envmap.outputs.SITE_NAME }}" -ErrorAction SilentlyContinue

            Remove-Item -Path "$destination\*" -Recurse -Force
            Expand-Archive -Path $zip -DestinationPath $destination -Force

            Start-WebAppPool -Name "${{ steps.envmap.outputs.APP_POOL }}"
            Start-Website -Name "${{ steps.envmap.outputs.SITE_NAME }}"
          }
          catch {
            Write-Error "Rollback failed: $($_.Exception.Message)"
            throw
          }
          exit 0

      # ---------------------------------------------------------
      # NOTIFY FAILURE
      # ---------------------------------------------------------
      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          $payload = @{ text = "❌ Deployment FAILED on `${{ github.ref_name }}`" } | ConvertTo-Json
          Invoke-WebRequest -Uri $env:WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json'
          exit 0
