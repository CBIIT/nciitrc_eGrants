name: Configure deployed eGrants GitHub token

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Select environment to configure"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
        default: dev

permissions:
  contents: read

jobs:
  configure:
    runs-on: ${{ (inputs.target_branch == 'dev' || inputs.target_branch == 'test') && 'egrants_fcas-oasys_runner' || 'egrants_fcas-oasys_runner_prod' }}

    environment: ${{ inputs.target_branch }}

    steps:
      - name: Replace deployed GitHubToken value
        shell: powershell
        env:
          DEPLOY_ENV: ${{ inputs.target_branch }}
          DEST_PATH_DEV: ${{ vars.DEST_PATH_DEV }}
          DEST_PATH_TEST: ${{ vars.DEST_PATH_TEST }}
          DEST_PATH_STAGE: ${{ vars.DEST_PATH_STAGE }}
          DEST_PATH_PROD: ${{ vars.DEST_PATH_PROD }}
          GITHUB_TOKEN_VALUE: ${{ secrets._GITHUB_TOKEN }}
          DEPLOY_USER: ${{ inputs.target_branch == 'test' && secrets.DEPLOY_USER_TEST || (inputs.target_branch == 'prod' && secrets.DEPLOY_USER_PROD) || '' }}
          DEPLOY_PASS: ${{ inputs.target_branch == 'test' && secrets.DEPLOY_PASS_TEST || (inputs.target_branch == 'prod' && secrets.DEPLOY_PASS_PROD) || '' }}
        run: |
          $ErrorActionPreference = 'Stop'

          $destination = switch ($env:DEPLOY_ENV) {
            'dev'   { $env:DEST_PATH_DEV }
            'test'  { $env:DEST_PATH_TEST }
            'stage' { $env:DEST_PATH_STAGE }
            'prod'  { $env:DEST_PATH_PROD }
            default { throw "Unsupported deployment environment." }
          }

          if ([string]::IsNullOrWhiteSpace($destination)) {
            throw "Destination path is missing for $env:DEPLOY_ENV."
          }

          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN_VALUE)) {
            throw "_GITHUB_TOKEN is missing or empty."
          }

          $driveName = 'EGrantsConfig'
          $driveCreated = $false

          try {
            if ($env:DEPLOY_ENV -in @('test', 'prod')) {
              if ([string]::IsNullOrWhiteSpace($env:DEPLOY_USER) -or
                  [string]::IsNullOrWhiteSpace($env:DEPLOY_PASS)) {
                throw "DEPLOY_USER or DEPLOY_PASS is missing."
              }

              $uncMatch = [regex]::Match(
                $destination,
                '^(\\\\[^\\]+\\[^\\]+)(?:\\(.*))?$'
              )

              if (-not $uncMatch.Success) {
                throw "Destination must be a valid UNC path for test/prod."
              }

              $shareRoot = $uncMatch.Groups[1].Value
              $relativePath = $uncMatch.Groups[2].Value

              $securePassword = ConvertTo-SecureString `
                $env:DEPLOY_PASS -AsPlainText -Force

              $credential = New-Object `
                System.Management.Automation.PSCredential(
                  $env:DEPLOY_USER,
                  $securePassword
                )

              New-PSDrive `
                -Name $driveName `
                -PSProvider FileSystem `
                -Root $shareRoot `
                -Credential $credential | Out-Null

              $driveCreated = $true
              $configDirectory = "${driveName}:\"

              if ($relativePath) {
                $configDirectory = Join-Path $configDirectory $relativePath
              }
            }
            else {
              $configDirectory = $destination
            }

            $file = Join-Path $configDirectory 'appsettings.json'

            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Deployed appsettings.json not found."
            }

            $resolvedPath = (Resolve-Path -LiteralPath $file).ProviderPath

            # Preserve UTF-8 encoding and the existing BOM, if present.
            $bytes = [System.IO.File]::ReadAllBytes($resolvedPath)
            $hasBom = $bytes.Length -ge 3 -and
                      $bytes[0] -eq 0xEF -and
                      $bytes[1] -eq 0xBB -and
                      $bytes[2] -eq 0xBF

            $encoding = New-Object System.Text.UTF8Encoding($hasBom, $true)
            $offset = if ($hasBom) { 3 } else { 0 }
            $content = $encoding.GetString(
              $bytes,
              $offset,
              $bytes.Length - $offset
            )

            # Replace only the string value, retaining all surrounding text.
            $pattern = '("GitHubToken"\s*:\s*)"(?:\\.|[^"\\])*"'
            $matchesFound = [regex]::Matches($content, $pattern)

            if ($matchesFound.Count -ne 1) {
              throw "Expected exactly one GitHubToken setting; found $($matchesFound.Count)."
            }

            $serializedToken = ConvertTo-Json `
              -InputObject $env:GITHUB_TOKEN_VALUE -Compress

            $updatedContent = [regex]::Replace(
              $content,
              $pattern,
              [System.Text.RegularExpressions.MatchEvaluator]{
                param($match)
                $match.Groups[1].Value + $serializedToken
              }
            )

            [System.IO.File]::WriteAllText(
              $resolvedPath,
              $updatedContent,
              $encoding
            )

            $savedContent = [System.IO.File]::ReadAllText(
              $resolvedPath,
              $encoding
            )

            if ($savedContent -cne $updatedContent) {
              throw "GitHubToken file update verification failed."
            }

            Write-Host "GitHubToken updated for $env:DEPLOY_ENV."
          }
          finally {
            if ($driveCreated) {
              Remove-PSDrive -Name $driveName -Force
            }
          }
